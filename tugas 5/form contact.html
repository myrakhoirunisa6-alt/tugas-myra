<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Contact</title>
</head>
<body>
  <h1>Form Contact</h1>
  <form>
    <fieldset>
      <legend>Contact</legend><br>
      <label for="Nama">Nama:</label>
      <input type="text" id="Nama" name="nama"  placeholder="Masukkan nama"><br><br>

      <label for="Email">Email:</label>
      <input type="email" id="Email" name="email" placeholder="Masukkan email"><br><br>

      <label for="Subject">Subject:</label>
      <input type="text" id="Subject" name="subject" placeholder="Masukkan subject"><br><br>

      <label for="Pesan">Pesan:</label><br>
      <textarea id="Pesan" name="Pesan" rows="4" cols="40" placeholder="Tulis pesan anda..." required></textarea><br><br>

      <input type="submit" value="send" formaction="table.html">
      <input type="reset" value="reset">

    </fieldset>
  </form>
</body>
</html>
